{% extends 'registration/_auth.html' %}
{% load ui %}
{% block title %}Password updated{% endblock %}
{% block card %}
<h2 style="font-family:var(--serif);font-size:26px;font-weight:500">Password updated</h2>
<p style="color:var(--tx-2);font-size:14px;margin-bottom:18px">Your password has been changed. You can now sign in with your new credentials.</p>
<a class="btn primary block" href="{% url 'accounts:login' %}" style="padding:11px">Go to sign in</a>
{% endblock %}
