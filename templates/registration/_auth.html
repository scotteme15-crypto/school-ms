{% load static ui %}<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% block title %}Account{% endblock %} — {{ school.school_name }}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/main.css' %}?v={{ asset_version }}">
<link rel="stylesheet" href="{% static 'css/components.css' %}?v={{ asset_version }}">
</head>
<body>
<div class="auth" style="grid-template-columns:1fr">
  <section class="auth-form">
    <div class="auth-box">
      <div class="crest" style="margin-bottom:22px">
        <div class="mark">{{ school.school_name|slice:":1"|upper }}</div>
        <div>
          <span class="wm">{{ school.school_name }}</span>
          <small>{{ school.motto|default:"Excellence in learning" }}</small>
        </div>
      </div>
      {% block card %}{% endblock %}
      <p style="margin-top:22px"><a class="btn ghost sm" href="{% url 'accounts:login' %}">{% icon 'right' 14 %} Back to sign in</a></p>
    </div>
  </section>
</div>
<script src="{% static 'js/main.js' %}?v={{ asset_version }}"></script>
<script src="{% static 'js/forms.js' %}?v={{ asset_version }}"></script>
</body>
</html>
